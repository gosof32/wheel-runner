<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<meta name="theme-color" content="#0a0a0b">

<style>
:root{
  --bg:#0a0a0b;--panel:#111113;--line:#26262b;--line2:#34343b;--fg:#e9e9ec;--mut:#8b8b95;
  --amber:#ffae1a;--cyan:#33d6ff;--green:#3dff8a;--pink:#ff4fd8;--red:#ff4b4b;--acc:var(--amber)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'JetBrains Mono',ui-monospace,monospace;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body.night{--acc:var(--cyan)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:1200px;margin:0 auto;padding:10px;gap:10px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;background:var(--panel)}
.brand h1{font-family:'VT323',monospace;font-weight:400;font-size:28px;letter-spacing:2px;color:var(--acc);text-shadow:0 0 12px color-mix(in srgb,var(--acc) 55%,transparent);white-space:nowrap;line-height:1}
.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}
.wbtn{font:600 12px 'JetBrains Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--fg);background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.wbtn:hover{border-color:var(--acc)}
.wbtn .d{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.wbtn.on .d{background:var(--green);box-shadow:0 0 8px var(--green)}
.wbtn.bad .d{background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat label{display:block;font-size:9.5px;letter-spacing:2px;color:var(--mut);text-transform:uppercase}
.stat b{display:block;font-family:'VT323',monospace;font-weight:400;font-size:26px;line-height:1.05;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b.hl{color:var(--acc);text-shadow:0 0 10px color-mix(in srgb,var(--acc) 50%,transparent)}
.pill{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;background:var(--mut)}
#stage{flex:1;position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#050506;min-height:220px}
#stage.glow{border-color:color-mix(in srgb,var(--acc) 60%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 25%,transparent),0 0 30px color-mix(in srgb,var(--acc) 12%,transparent)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glowc{filter:blur(6px);opacity:.55}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);font:400 22px 'VT323',monospace;letter-spacing:1px;color:var(--acc);background:rgba(10,10,11,.85);border:1px solid var(--line2);border-radius:8px;padding:4px 12px;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
#overlay{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;background:rgba(5,5,6,.72);backdrop-filter:blur(2px);padding:14px;overflow:auto}
.card{margin:auto 0;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px color-mix(in srgb,var(--acc) 20%,transparent),0 20px 60px rgba(0,0,0,.6)}
.card .art{height:92px;position:relative;border-bottom:1px solid var(--line)}
.card .art canvas{position:absolute;inset:0}
.card .body{padding:16px 18px 18px}
.card h2{font-family:'VT323',monospace;font-weight:400;font-size:34px;letter-spacing:2px;line-height:1;color:var(--fg)}
.card h2 em{font-style:normal;color:var(--acc)}
.card p{font-size:12.5px;line-height:1.6;color:#c4c4cc;margin-top:8px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rule{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.45;color:#bdbdc6}
.rule b{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.meta{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);margin-top:14px}
.meta a{color:var(--cyan);text-decoration:none}
.pred{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn{font:700 13px 'JetBrains Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;border-radius:8px;padding:12px 14px;cursor:pointer;border:1px solid var(--line2);background:#17171a;color:var(--fg)}
.btn:hover{border-color:var(--acc)}
.btn.sel{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.btn.primary{width:100%;margin-top:12px;background:var(--acc);border-color:var(--acc);color:#0a0a0b}
.row{display:flex;gap:8px;margin-top:8px}.row .btn{flex:1}
.big{font-family:'VT323',monospace;font-size:64px;line-height:1;color:var(--acc);text-shadow:0 0 18px color-mix(in srgb,var(--acc) 55%,transparent);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:11.5px;color:#c4c4cc}
.kv span{color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-size:10px;display:block}
.sig{margin-top:10px;font-size:10.5px;color:var(--green);word-break:break-all;line-height:1.5}
#runs{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
#runs h3{font-size:10px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;font-weight:600;margin-bottom:6px}
#runs li{list-style:none;display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px dashed var(--line);color:#c4c4cc}
#runs li b{color:var(--acc);font-weight:700}
#pause{position:absolute;right:10px;top:10px;width:36px;height:36px;display:none;place-items:center;border-radius:8px;border:1px solid var(--line2);background:rgba(10,10,11,.75);color:var(--acc);font:700 13px 'JetBrains Mono',monospace;cursor:pointer;z-index:2}
#ach{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);opacity:0;transition:.3s;background:rgba(10,10,11,.92);border:1px solid var(--acc);border-radius:10px;padding:8px 14px;text-align:center;pointer-events:none;box-shadow:0 0 24px color-mix(in srgb,var(--acc) 30%,transparent);z-index:3;white-space:nowrap}
#ach.on{opacity:1;transform:translate(-50%,0)}#ach b{display:block;font:400 24px 'VT323',monospace;color:var(--acc);letter-spacing:1px}#ach span{font-size:11px;color:#c4c4cc}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.nav .btn{font-size:11px;padding:10px 6px;position:relative}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 6px var(--red);vertical-align:middle;margin-left:2px}
.top{display:flex;align-items:center;gap:10px}.btn.back{padding:6px 12px;font-size:16px}
.sec{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--mut);margin:16px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.hrow{display:flex;gap:12px;align-items:center;padding:7px 0;font-size:12px;line-height:1.5;color:#c4c4cc}.hrow>div b{display:block;color:var(--fg);font-size:12.5px}
.hrow>:first-child{min-width:64px;display:flex;gap:4px;align-items:center;justify-content:center;flex-shrink:0}
.ico{image-rendering:pixelated;height:26px;width:auto}.gw{font-size:22px;color:#fff0a8;text-shadow:0 0 10px #ffd23f}
.bank{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#c4c4cc}.bank .ico{height:14px}.bank b{color:var(--acc);font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:9px;color:var(--mut)}
.day b{display:block;font:400 18px 'VT323',monospace;color:var(--fg)}.day.got{border-color:color-mix(in srgb,var(--acc) 50%,var(--line));background:color-mix(in srgb,var(--acc) 10%,transparent)}.day.got b{color:var(--acc)}
.day.now{border-color:var(--acc);box-shadow:0 0 12px color-mix(in srgb,var(--acc) 35%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.sm{padding:6px 8px;font-size:10px;width:100%}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.skin{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px}
.skin.sel{border-color:var(--acc)}.skin .ico{height:30px}.skin .eq{color:var(--acc);font-size:10px;letter-spacing:1px;text-transform:uppercase}.skin .lk{color:var(--mut);font-size:10px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);opacity:.75}.ach.done{opacity:1}.medal{font-size:20px;width:26px;text-align:center}
.ad{flex:1;min-width:0}.ad b{display:block;font-size:12.5px}.ad span{display:block;font-size:11px;color:var(--mut)}.ad em{font-style:normal;font-size:10px;color:var(--mut)}
.bar{display:block;height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.rw{font-size:11px;color:var(--acc);text-align:right;min-width:44px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer;position:relative}
.set b{display:block;font-size:12.5px}.set span{font-size:11px;color:var(--mut)}
.set input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}.sw{width:40px;height:22px;border-radius:22px;background:var(--line2);position:relative;flex-shrink:0;transition:.2s}
.sw:after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#888;transition:.2s}
.set input:checked+.sw{background:color-mix(in srgb,var(--acc) 45%,var(--line2))}.set input:checked+.sw:after{left:21px;background:var(--acc)}
.set input[type=range]{width:45%;accent-color:var(--acc)}
#turbo{position:absolute;right:10px;bottom:10px;width:92px;height:44px;display:none;border-radius:10px;border:1px solid var(--line2);background:rgba(10,10,11,.8);color:var(--mut);font:700 12px 'JetBrains Mono',monospace;letter-spacing:2px;cursor:pointer;overflow:hidden;z-index:2;touch-action:none}
#turbo i{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--acc) 35%,transparent);transition:width .15s}
#turbo span{position:relative}#turbo.ready{color:#0a0a0b;border-color:var(--acc);background:var(--acc);box-shadow:0 0 18px var(--acc);animation:tp .6s infinite alternate}
#turbo.ready i{display:none}#turbo.on{color:#0a0a0b;background:#ff4b4b;border-color:#ff4b4b;box-shadow:0 0 22px #ff4b4b}
@keyframes tp{to{transform:scale(1.06)}}
.maps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}.mapb{font-size:9.5px;padding:9px 2px;letter-spacing:.5px}
@media (max-width:640px){.maps{grid-template-columns:repeat(3,1fr)}}
footer{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);gap:10px}
footer a{color:var(--mut)}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat.hide-m{display:none}
  .brand h1{font-size:22px}.brand small{display:none}
  .rules{grid-template-columns:1fr}
  .stat b{font-size:22px}
  footer .hide-m{display:none}
  #stage{flex:none;height:min(64vh,100vw)}
  #app{overflow:auto}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo"><canvas id="logoc" width="22" height="22" style="position:static;width:22px;height:22px"></canvas></div>
      <div><h1>WHEEL RUNNER</h1><small>Powered by Squeektoshi · Squeekchain</small></div>
    </div>
    <button class="wbtn" id="wallet"><span class="d"></span><span id="wtxt">Connect Wallet</span></button>
  </header>

  <div class="stats">
    <div class="stat"><label>Wheel</label><b id="wstat"><span class="pill" id="wdot"></span>…</b></div>
    <div class="stat"><label>RPM</label><b id="wrpm" class="hl">–</b></div>
    <div class="stat hide-m"><label>Squeek Block</label><b id="wblk">–</b></div>
    <div class="stat"><label>Score</label><b id="sc" class="hl">0</b></div>
    <div class="stat hide-m"><label>Best</label><b id="best">0</b></div>
  </div>

  <div id="stage">
    <canvas id="glowc"></canvas>
    <canvas id="c"></canvas>
    <div id="toast"></div>
    <div id="ach"></div>
    <button id="pause" aria-label="Pause">❚❚</button>
    <button id="turbo" aria-label="Turbo"><i id="tfill"></i><span>TURBO</span></button>
    <div id="overlay">
      <div class="card" id="menu"></div>
    </div>
  </div>

  <footer>
    <span id="src">Connecting to Squeekchain…</span>
    <span class="hide-m">Sepolia · chainId 11155111</span>
  </footer>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);

/* =========================================================
   1. LIVE SQUEEKCHAIN FEED
   ========================================================= */
const API=['https://api.squeekchain.com/v1','https://squeekchain.com/api/v1'];
const live={ok:false,running:false,rpm:0,block:null,sim:false};
function findKey(o,names,d=0){
  if(!o||typeof o!=='object'||d>4) return;
  for(const k of Object.keys(o)) if(names.includes(k.toLowerCase())) return o[k];
  for(const k of Object.keys(o)){const v=findKey(o[k],names,d+1); if(v!==undefined) return v;}
}
async function getJSON(p){for(const b of API){try{const r=await fetch(b+p,{cache:'no-store'}); if(r.ok) return await r.json();}catch(e){}} return null;}
async function poll(){
  const [st,eco]=await Promise.all([getJSON('/status'),getJSON('/economy/state')]);
  if(st){
    live.ok=true; live.sim=false;
    const rpm=Number(findKey(st,['rpm','wheelrpm','wheel_rpm','currentrpm'])??0);
    const s=findKey(st,['status','wheelstatus','wheel_status','state','running','isrunning','is_running']);
    let run=typeof s==='boolean'?s:(typeof s==='string'?(/run|spin|active|moving|on/i.test(s)&&!/stop|idle|sleep|off/i.test(s)):rpm>0);
    if(rpm>0) run=true;
    live.rpm=isFinite(rpm)?rpm:0; live.running=run;
    const b=findKey(st,['blockheight','block_height','height','squeekheight','block'])??findKey(eco,['blockheight','block_height','height','squeekheight']);
    if(b!==undefined&&typeof b!=='object'){const n=Number(b); if(isFinite(n)){ if(live.block!==null&&n>live.block) onNewBlock(n); live.block=n; }}
    live.src='api';
  } else if(!(await chainPoll())) simulate();
  hud();
}
/* On-chain fallback: SqueekCore.state() on Ethereum Sepolia (proxy 0x7466…119f).
   state() -> (settledThroughRound, cumulativeWork, cumulativeBlockUnits, blockHeight, blockProgress, workPerThousandBlocks, nonce, paused)
   Rounds are 600s; the hamster counts as running when cumulativeWork grew in the last ~20 minutes. */
const SQUEEK_CORE='0x74665dAecA35A2303e767E76a2FF1FB6F93e119f';
const RPCS=['https://ethereum-sepolia-rpc.publicnode.com'];
async function chainState(){
  for(const rpc of RPCS){
    try{
      const r=await fetch(rpc,{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_call',params:[{to:SQUEEK_CORE,data:'0xc19d93fb'},'latest']})});
      const j=await r.json(); if(!j.result||j.result.length<2+64*8) continue;
      const h=j.result.slice(2), w=i=>BigInt('0x'+h.slice(i*64,i*64+64));
      return {round:Number(w(0)),work:Number(w(1)),height:Number(w(3)),progress:Number(w(4)),paused:w(7)!==0n};
    }catch(e){}
  }
  // last resort: the connected wallet's own Sepolia RPC
  try{ if(window.ethereum&&W3.chain==='0xaa36a7'){ const res=await window.ethereum.request({method:'eth_call',params:[{to:SQUEEK_CORE,data:'0xc19d93fb'},'latest']});
    const h=res.slice(2), w=i=>BigInt('0x'+h.slice(i*64,i*64+64)); return {round:Number(w(0)),work:Number(w(1)),height:Number(w(3)),progress:Number(w(4)),paused:w(7)!==0n}; } }catch(e){}
  return null;
}
const HKEY='wr_chain_hist';
async function chainPoll(){
  const cs=await chainState(); if(!cs) return false;
  const now=Date.now();
  let hist=[]; try{hist=JSON.parse(localStorage.getItem(HKEY))||[]}catch(e){}
  hist.push({t:now,work:cs.work,round:cs.round}); hist=hist.filter(x=>now-x.t<40*60e3).slice(-200);
  localStorage.setItem(HKEY,JSON.stringify(hist));
  const recent=hist.filter(x=>now-x.t<20*60e3), first=recent[0];
  const dWork=cs.work-first.work, dRound=Math.max(1,cs.round-first.round);
  live.running=!cs.paused&&dWork>0;
  live.rpm=live.running?Math.max(20,Math.min(120,Math.round(dWork/dRound/10))):0;
  if(live.block!==null&&cs.height>live.block) onNewBlock(cs.height);
  live.block=cs.height; live.ok=true; live.sim=false; live.src='chain';
  return true;
}
let simP=Math.random()*1000;
function simulate(){
  live.sim=true; live.ok=false; simP++;
  const awake=Math.sin(simP/9)>-0.35;
  live.running=awake; live.rpm=awake?Math.round(55+35*Math.abs(Math.sin(simP/3))):0;
  if(live.block===null) live.block=1000+Math.floor(Math.random()*500);
  if(awake&&Math.random()<.25){live.block++; onNewBlock(live.block);}
}
function hud(){
  $('wstat').innerHTML=`<span class="pill" style="background:${live.running?'var(--green)':'var(--red)'};box-shadow:0 0 8px ${live.running?'var(--green)':'var(--red)'}"></span>${live.running?'RUNNING':'ASLEEP'}`;
  $('wrpm').textContent=live.rpm?live.rpm.toFixed(0):'0';
  $('wblk').textContent=live.block??'–';
  $('src').textContent=live.sim?'Squeekchain unreachable · simulated wheel':(live.src==='chain'?'Live · SqueekCore on Sepolia':'Live · api.squeekchain.com/v1');
  document.body.classList.toggle('night',!live.running);
}
poll(); setInterval(poll,15000);

/* =========================================================
   2. WALLET (EIP-1193) · SEPOLIA
   ========================================================= */
const SEPOLIA={chainId:'0xaa36a7',chainName:'Sepolia',nativeCurrency:{name:'Sepolia ETH',symbol:'ETH',decimals:18},rpcUrls:['https://rpc.sepolia.org','https://ethereum-sepolia-rpc.publicnode.com'],blockExplorerUrls:['https://sepolia.etherscan.io']};
const W3={addr:null,chain:null,bal:null};
const eth=()=>window.ethereum;
const short=a=>a?a.slice(0,6)+'…'+a.slice(-4):'';
function walletUI(){
  const b=$('wallet'); b.classList.remove('on','bad');
  if(!W3.addr){$('wtxt').textContent='Connect Wallet'; return;}
  if(W3.chain!==SEPOLIA.chainId){b.classList.add('bad'); $('wtxt').textContent='Switch to Sepolia'; return;}
  b.classList.add('on'); $('wtxt').textContent=short(W3.addr)+(W3.bal!==null?' · '+W3.bal+' ETH':'');
}
async function ensureSepolia(){
  try{ await eth().request({method:'wallet_switchEthereumChain',params:[{chainId:SEPOLIA.chainId}]}); }
  catch(e){ if(e&&(e.code===4902||/Unrecognized|not added/i.test(e.message||''))) await eth().request({method:'wallet_addEthereumChain',params:[SEPOLIA]}); else throw e; }
  W3.chain=await eth().request({method:'eth_chainId'});
}
async function refreshBal(){
  if(!W3.addr||W3.chain!==SEPOLIA.chainId){W3.bal=null; return;}
  try{const h=await eth().request({method:'eth_getBalance',params:[W3.addr,'latest']}); W3.bal=(Number(BigInt(h))/1e18).toFixed(4);}catch(e){W3.bal=null;}
}
async function connect(){
  if(!eth()){
    if(/Android|iPhone|iPad/i.test(navigator.userAgent)){ location.href='https://metamask.app.link/dapp/'+location.host+location.pathname; return; }
    toast('No wallet found · install MetaMask'); return;
  }
  try{
    const acc=await eth().request({method:'eth_requestAccounts'});
    W3.addr=acc[0]; W3.chain=await eth().request({method:'eth_chainId'});
    if(W3.chain!==SEPOLIA.chainId) await ensureSepolia();
    await refreshBal(); walletUI(); renderRuns(); toast('Connected on Sepolia');
  }catch(e){ toast(e&&e.code===4001?'Request rejected':'Wallet error'); walletUI(); }
}
$('wallet').onclick=async()=>{
  if(W3.addr&&W3.chain!==SEPOLIA.chainId){ try{await ensureSepolia(); await refreshBal();}catch(e){} walletUI(); return; }
  if(!W3.addr) connect();
  else window.open('https://sepolia.etherscan.io/address/'+W3.addr,'_blank');
};
if(eth()){
  eth().request({method:'eth_accounts'}).then(async a=>{ if(a[0]){W3.addr=a[0]; W3.chain=await eth().request({method:'eth_chainId'}); await refreshBal(); walletUI(); renderRuns();} }).catch(()=>{});
  eth().on&&eth().on('accountsChanged',async a=>{W3.addr=a[0]||null; await refreshBal(); walletUI(); renderRuns();});
  eth().on&&eth().on('chainChanged',async c=>{W3.chain=c; await refreshBal(); walletUI();});
}
async function signRun(run){
  if(!W3.addr){ await connect(); if(!W3.addr) return null; }
  if(W3.chain!==SEPOLIA.chainId){ try{await ensureSepolia();}catch(e){return null;} }
  const msg=`Wheel Runner · Squeekchain\nPlayer: ${W3.addr}\nScore: ${run.score}\nSeeds: ${run.seeds}\nSqueek block: ${run.block??'n/a'}\nWheel at finish: ${run.wheel} (${run.rpm} RPM)\nNetwork: Sepolia (11155111)\nTime: ${new Date(run.t).toISOString()}`;
  const hex='0x'+[...new TextEncoder().encode(msg)].map(b=>b.toString(16).padStart(2,'0')).join('');
  try{ const sig=await eth().request({method:'personal_sign',params:[hex,W3.addr]}); return {msg,sig}; }
  catch(e){ toast('Signature rejected'); return null; }
}

function renderRuns(){
  const el=$('runs'); if(!el) return;
  const mine=loadRuns().filter(r=>!W3.addr||r.addr.toLowerCase()===W3.addr.toLowerCase()).slice(0,5);
  el.innerHTML=`<h3>Signed runs${W3.addr?' · '+short(W3.addr):''}</h3>`+(mine.length?mine.map((r,i)=>`<li><span>#${i+1} · ${short(r.addr)} · blk ${r.block??'–'}</span><b>${r.score}</b></li>`).join(''):'<li><span>No signed runs yet. Connect a wallet and sign your best score.</span></li>');
}

const cv=$('c'),ctx=cv.getContext('2d'),gc=$('glowc'),gctx=gc.getContext('2d');
const LH=96; let LW=170, CELL=6, W=0,H=0,DPR=1;
const low=document.createElement('canvas'), lx=low.getContext('2d');
let mask=null;
function resize(){
  const st=$('stage'); W=st.clientWidth; H=st.clientHeight; DPR=Math.min(2,devicePixelRatio||1);
  CELL=Math.max(3,Math.floor(H/LH)); LW=Math.ceil(W/CELL);
  const lh=Math.ceil(H/CELL);
  low.width=LW; low.height=lh;
  for(const c of [cv,gc]){c.width=W*DPR; c.height=H*DPR;}
  ctx.setTransform(DPR,0,0,DPR,0,0); gctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=false; gctx.imageSmoothingEnabled=false;
  // dot mask: dark grid with round holes
  mask=document.createElement('canvas'); mask.width=W*DPR; mask.height=H*DPR;
  const m=mask.getContext('2d'); m.scale(DPR,DPR); m.fillStyle='#050506'; m.fillRect(0,0,W,H);
  m.globalCompositeOperation='destination-out';
  const r=CELL*0.42;
  for(let y=0;y<lh;y++) for(let x=0;x<LW;x++){m.beginPath(); m.arc(x*CELL+CELL/2,y*CELL+CELL/2,r,0,6.283); m.fill();}
  GY=Math.round(lh*0.82); VH=lh;
}

const AU={c:null};
function auInit(){
  if(AU.c){ if(AU.c.state==='suspended') AU.c.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  AU.c=new C(); AU.m=AU.c.createGain(); AU.m.connect(AU.c.destination);
  AU.s=AU.c.createGain(); AU.s.connect(AU.m); AU.mu=AU.c.createGain(); AU.mu.connect(AU.m); applyAudio();
}
function applyAudio(){ if(!AU.c) return; const s=SAVE.settings; AU.m.gain.value=s.vol; AU.s.gain.value=s.sfx?1:0; AU.mu.gain.value=s.music?.32:0; }
addEventListener('pointerdown',auInit,{passive:true}); addEventListener('keydown',auInit);
function tone(f,d,type='square',v=.2,slide=0,delay=0,dest){
  const c=AU.c; if(!c) return; const t=c.currentTime+Math.max(0,delay);
  const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g); g.connect(dest||AU.s); o.start(t); o.stop(t+d+.03);
}
let NB=null;
function noise(d,v=.3,f=1500,delay=0,dest){
  const c=AU.c; if(!c) return; const t=c.currentTime+Math.max(0,delay);
  if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate); const a=NB.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=Math.random()*2-1;}
  const s=c.createBufferSource(); s.buffer=NB; const fl=c.createBiquadFilter(); fl.type='lowpass';
  fl.frequency.setValueAtTime(f,t); fl.frequency.exponentialRampToValueAtTime(60,t+d);
  const g=c.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0008,t+d);
  s.connect(fl); fl.connect(g); g.connect(dest||AU.s); s.start(t); s.stop(t+d+.03);
}

function onNewBlock(n){ if(state==='play'){ seeds.push({x:LW+6,y:GY-26,gold:true}); toast(`⛏ Block #${n} mined · Golden Wheel incoming`);} }
function burst(x,y,n,s,sp=50){for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*sp,vy:-Math.random()*sp,l:.5+Math.random()*.3,s});}
function explode(x,y){ burst(x,y,26,5,110); burst(x,y,16,3,70); shake=.35; SFX.boom(); vib([30,30,60]); }

const KINDS=['trap','box','cat','owl'];
function spawn(){
  const pool=live.running?KINDS.slice(0,3):KINDS;
  const k0=pool[Math.floor(Math.random()*pool.length)], k=(MAPOBS[SAVE.map]||{})[k0]||k0, s=SZ(k==='owl'?'owl1':k);
  obs.push({k,x:LW+4,w:s.w,h:s.h,y:k==='owl'?GY-14-Math.floor(Math.random()*8):GY});
}
function fireRocket(off=0){ rockets.push({ph:'warn',t:1.25+off,y:P.y-5,beep:0,x:LW+2,lock:false}); }
function step(dt){
  frame+=dt; playTime+=dt;
  const rpm=live.running?Math.max(20,live.rpm):0;
  const target=(live.running?50+rpm*0.62:40)*Math.min(1.6,1+dist/12000)*(turbo>0?1.8:1);
  speed+= (target-speed)*Math.min(1,dt*(turbo>0?3:0.9));
  if(turbo>0){ turbo-=dt; if(Math.random()<.9) parts.push({x:P.x-1,y:P.y-2-Math.random()*6,vx:-60-Math.random()*40,vy:(Math.random()-.5)*20,l:.3,s:Math.random()<.5?5:4}); if(turbo<=0){ turbo=0; shield=Math.max(shield,1); toast('Turbo over'); } turboUI(); }
  dist+=speed*dt;
  const mult=1+rpm/100, nm=live.running?1:2;
  score+=speed*dt*0.05*mult*(turbo>0?2:1);
  P.vy+=(SAVE.map==='space'?250:360)*dt; P.y+=P.vy*dt; if(P.y>=GY){P.y=GY;P.vy=0;P.j=0;}
  spawnT-=dt; if(spawnT<=0){spawn(); spawnT=Math.max(.55,1.5-dist/9000)*(.7+Math.random()*.8)*(60/Math.max(40,speed)+.35);}
  seedT-=dt; if(seedT<=0){const n=1+Math.floor(Math.random()*4), y=GY-5-Math.floor(Math.random()*22); for(let i=0;i<n;i++) seeds.push({x:LW+4+i*6,y}); seedT=.9+Math.random()*1.2;}
  // rockets: start after ~6s, faster and in volleys as the run goes on
  if(playTime>6){ rocketT-=dt; if(rocketT<=0){ const lvl=Math.min(1,dist/14000); fireRocket(); if(Math.random()<lvl*.6) fireRocket(.55); if(Math.random()<lvl*.25) fireRocket(1.1);
      rocketT=Math.max(2.6,7.5-dist/2500)*(.75+Math.random()*.6)*(live.running?1:.85); } }
  itemT-=dt; if(itemT<=0){ items.push({k:'magnet',x:LW+4,y:GY-8-Math.floor(Math.random()*16)}); itemT=20+Math.random()*12; }
  for(const o of obs) o.x-=speed*dt; for(const s of seeds) s.x-=speed*dt; for(const it of items) it.x-=speed*dt;
  const hx=P.x+1,hy=P.y-9+1,hw=10,hh=7, pcx=P.x+6, pcy=P.y-5;
  if(magnet>0){ magnet-=dt; for(const s of seeds){ if(s.gold) continue; const dx=pcx-s.x, dy=pcy-s.y, d=Math.hypot(dx,dy); if(d<55){ s.x+=dx/d*160*dt; s.y+=dy/d*160*dt; } } }
  obs=obs.filter(o=>o.x>-14); seeds=seeds.filter(s=>s.x>-8&&!s.got); items=items.filter(i=>i.x>-10&&!i.got);
  for(const s of seeds){const sw=s.gold?7:3; if(s.x<hx+hw&&s.x+sw>hx&&s.y-sw<hy+hh&&s.y>hy){ s.got=true;
    if(s.gold){shield=6; score+=50; runGold++; addMeter(.35); burst(s.x,s.y-3,14,5); SFX.gold(); vib(20); toast('🛡 Golden Wheel · shield 6s');} else {seedsGot++; score+=5*nm; burst(s.x+1,s.y-1,3,5); SFX.seed(); addMeter(.05);} }}
  for(const it of items){ if(it.x<hx+hw&&it.x+7>hx&&it.y-7<hy+hh&&it.y>hy){ it.got=true; magnet=8; SFX.magnet(); burst(it.x+3,it.y-3,10,4); toast('🧲 Seed magnet · 8s'); } }
  if(shield>0) shield-=dt;
  for(const o of obs){ const ox=o.x+1,oy=o.y-o.h+1,ow=o.w-2,oh=o.h-1;
    if(hx<ox+ow&&hx+hw>ox&&hy<oy+oh&&hy+hh>oy){ if(turbo>0){o.x=-99; burst(ox,oy,16,5,90); score+=30; runSmash++; shake=.12; SFX.coin();} else if(shield>0){o.x=-99; burst(ox,oy,10,5); score+=20; SFX.coin();} else return over(o.k); } }
  // rocket logic
  for(const r of rockets){
    if(r.ph==='warn'){ r.t-=dt; if(!r.lock){ r.y+=(P.y-5-r.y)*Math.min(1,dt*4); if(r.t<.4) r.lock=true; }
      r.y=Math.max(8,Math.min(GY-2,r.y)); r.beep-=dt; if(r.beep<=0){ SFX.warn(); r.beep=r.t<.5?.1:.22; }
      if(r.t<=0){ r.ph='fly'; r.x=LW+2; SFX.launch(); } }
    else { r.x-=(speed+170)*dt; if(Math.random()<.7) parts.push({x:r.x+11,y:r.y+(Math.random()-.5)*2,vx:30,vy:(Math.random()-.5)*10,l:.35,s:2});
      const rx=r.x+1,ry=r.y-2,rw=9,rh=4;
      if(!r.dead&&hx<rx+rw&&hx+hw>rx&&hy<ry+rh&&hy+hh>ry){ r.dead=true; explode(r.x+4,r.y); if(turbo>0){ score+=60; runSmash++; } else if(shield>0){ score+=40; toast('💥 Rocket blocked'); } else return over('rocket'); }
      if(!r.dead&&!r.passed&&r.x+10<P.x){ r.passed=true; runRockets++; score+=15; SFX.dodge(); addMeter(.2); } } }
  rockets=rockets.filter(r=>!r.dead&&r.x>-14);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.l-=dt;} parts=parts.filter(p=>p.l>0);
  if(shake>0) shake-=dt;
  $('sc').textContent=Math.floor(score);
}

const stars=[...Array(60)].map(()=>({x:Math.random(),y:Math.random()*.6,t:Math.random()*6}));
let bg=0;
function sprSkin(name,x,y){ const sk=SKINS[SAVE.skin]&&SKINS[SAVE.skin].c; const s=SPR[name];
  const tt=performance.now(); for(let j=0;j<s.length;j++){const r=s[j]; for(let i=0;i<r.length;i++){const c=r[i]; if(c==='.') continue; px(x+i,y+j,sk==='rainbow'&&c!=='0'?rainbowC(c,i,tt):(sk&&sk[c])||+c);}}}
function drawMap(MP,t,n){
  const o=bg*.3;
  if(MP==='meadow'){ for(let x=0;x<LW;x++){ const h=Math.round(6+Math.sin((x+o)/16)*3+Math.sin((x+o)/7)*1.5); for(let y=GY-h;y<GY;y++) if((x+y)%2===0||y>GY-h+1) px(x,y,1); } }
  if(MP==='city'){ const off=bg*.25;
    for(let x=0;x<LW;x++){ const wx=x+Math.floor(off), b=Math.floor(wx/11), inB=wx%11<9; if(!inB) continue; const h=12+hsh(b)%Math.max(8,Math.floor(GY*.45)), top=GY-h;
      for(let y=top;y<GY;y++){ const edge=(wx%11===0||wx%11===8||y===top); const win=!edge&&(wx%11)%3===1&&(y-top)%4===2; if(edge) px(x,y,1); else if(win){ const on=hsh(b*97+y+(wx%11))%10<(n>.5?7:3); px(x,y,on?(n>.5?3:2):1);} else if((x+y)%3===0) px(x,y,1);} } }
  if(MP==='desert'){ for(let x=0;x<LW;x++){ const h=Math.round(9+Math.sin((x+o*.7)/26)*5+Math.sin((x+o*.7)/9)*1.5); for(let y=GY-h;y<GY;y++) if((x*3+y)%4===0||y>GY-h+1) px(x,y,y===GY-h?2:1); }
    const px0=Math.round(LW*.25-(o*.15)%(LW*1.5)); for(let k=0;k<14;k++) for(let i=-k;i<=k;i++) if((i+k)%2===0) px(px0+i,GY-16+k,1); }
  if(MP==='space'){ const cx=Math.round(LW*.18), cy=Math.round(GY*.3), r=9; for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){ const d=x*x+y*y; if(d<=r*r&&(x+y)%2===0) px(cx+x,cy+y,x+y<-4?3:2);} for(let a=0;a<60;a++){const q=a/60*6.283; px(cx+Math.cos(q)*15,cy+Math.sin(q)*4,3);}
    for(let i=0;i<8;i++){ const ax=LW-((t/40+i*61+o*.5)%(LW+20)), ay=8+hsh(i)%Math.max(10,GY-30); px(ax,ay,2); px(ax+1,ay,1);} }
  if(MP==='cave'){ for(let x=0;x<LW;x++){ const wx=x+Math.floor(o), h=Math.max(0,Math.round(4+Math.sin(wx/9)*3+(hsh(Math.floor(wx/6))%6))); for(let y=0;y<h;y++) if((x+y)%2===0||y<2) px(x,y,1);
      const g=Math.round(5+Math.sin(wx/13)*3); for(let y=GY-g;y<GY;y++) if((x+y)%2===0) px(x,y,1);} }
}
function render(t){
  const n=nightT; pal=mixPal(n);
  lx.fillStyle=pal[0]; lx.fillRect(0,0,low.width,low.height);
  const MP=SAVE.map;
  if(n>.1||MP==='space') for(const s of stars){ if(Math.sin(t/600+s.t)>-.3) px(s.x*LW,s.y*GY,n>.6?3:2); }
  const mx=Math.round(LW*.84), my=Math.round(GY*.2), R=MP==='desert'?7:5;
  if(MP!=='cave') for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++){ if(x*x+y*y<=R*R){ if(n>.5 && (x-3)*(x-3)+(y+2)*(y+2)<=R*R) continue; px(mx+x,my+y,n>.5?4:3);} }
  const cx=Math.round(LW*.6), cy=Math.round(GY*.52), WR=Math.round(GY*.42);
  const ang=(t/1000)*(live.rpm/60)*Math.PI*2*0.5;
  for(let a=0;a<360;a+=2){const r=a*Math.PI/180; px(cx+Math.cos(r)*WR,cy+Math.sin(r)*WR,1);}
  for(let i=0;i<8;i++){const a=ang+i*Math.PI/4; for(let k=3;k<WR;k+=2) px(cx+Math.cos(a)*k,cy+Math.sin(a)*k,1);}
  rect(cx-1,cy-1,3,3,2);
  bg+=(state==='play'?speed:state==='pause'?0:14)*0.016;
  drawMap(MP,t,n);
  rect(0,GY,LW,1,3);
  if(MP==='cave'){ for(let x=0;x<LW;x++){ const f=Math.sin(x/5+t/300)+Math.sin(x/11-t/500); if(f>1.1) px(x,GY+1,4); else if(f>.4) px(x,GY+1,3);} }
  if(MP==='space'){ for(let x=-(Math.floor(bg)%16);x<LW;x+=16) px(x,GY+1,Math.floor(t/300+x)%2?4:2); }
  for(let x=-(Math.floor(bg)%8);x<LW;x+=8) rect(x,GY+2,4,1,2);
  for(let x=-(Math.floor(bg*.7)%13);x<LW;x+=13) px(x,GY+4,1);
  for(const s of seeds){ if(s.gold){ const f=Math.floor(t/120)%2; const c=s.x|0,y=s.y|0; for(let a=0;a<12;a++){const r=a/12*6.283; px(c+3+Math.cos(r)*3.2,y-3+Math.sin(r)*3.2,PAL.gold);} for(let a=0;a<4;a++){const r=a*Math.PI/4+(f?Math.PI/8:0); px(c+3+Math.cos(r)*1.6,y-3+Math.sin(r)*1.6,PAL.gold);px(c+3-Math.cos(r)*1.6,y-3-Math.sin(r)*1.6,PAL.gold);} px(c+3,y-3,PAL.gold);} else spr('seed',s.x,s.y-3); }
  for(const it of items){ spr('magnet',it.x,it.y-7); if(Math.floor(t/150)%2) px(it.x+3,it.y-9,5); }
  for(const o of obs){ const name=o.k==='owl'?(Math.floor(t/140)%2?'owl1':'owl2'):o.k; spr(name,o.x,o.y-o.h); }
  // rocket warnings and rockets
  for(const r of rockets){
    if(r.ph==='warn'){ if(Math.floor(t/(r.t<.5?60:130))%2){ const wx=LW-7, wy=r.y|0; spr('warn',wx,wy-3,r.lock?'#ff4b4b':5); }
      for(let x=P.x+16;x<LW-9;x+=4) if(r.lock) px(x,r.y,'#5a1414'); }
    else { spr('rocket',r.x,r.y-2); const f=Math.floor(t/50)%2; px(r.x+10,r.y,f?5:4); px(r.x+11,r.y,4); if(f) px(r.x+12,r.y,3); }
  }
  // hamster
  const name=P.y<GY?'hamJ':(Math.floor(frame*Math.max(6,speed/6))%2?'ham1':'ham2');
  sprSkin(name,P.x,P.y-9);
  if(shield>0&&Math.floor(t/90)%2){ for(let a=0;a<20;a++){const r=a/20*6.283; px(P.x+6+Math.cos(r)*8,P.y-5+Math.sin(r)*7,PAL.gold);} }
  if(turbo>0){ for(let i=0;i<10;i++){ const yy=((i*37+Math.floor(t/16)*7)%(GY-4))+2, xx=LW-((t/2+i*53)%LW); rect(xx,yy,6,1,2);} for(let a=0;a<6;a++) px(P.x+13+a%2,P.y-8+a,5); }
  if(magnet>0&&Math.floor(t/120)%2){ for(let a=0;a<14;a++){const r=a/14*6.283+t/300; px(P.x+6+Math.cos(r)*11,P.y-5+Math.sin(r)*9,4);} }
  for(const p of parts) px(p.x,p.y,p.s);
  let sx=0,sy=0; if(shake>0&&SAVE.settings.shake){ sx=Math.round((Math.random()-.5)*3)*CELL; sy=Math.round((Math.random()-.5)*3)*CELL; }
  gctx.clearRect(0,0,W,H); gctx.drawImage(low,sx,sy,low.width*CELL,low.height*CELL);
  ctx.clearRect(0,0,W,H); ctx.drawImage(low,sx,sy,low.width*CELL,low.height*CELL);
  ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(mask,0,0); ctx.setTransform(DPR,0,0,DPR,0,0);
}

const ICON={};
function icon(name,shade){ const key=name+(shade||''); if(ICON[key]) return ICON[key];
  const s=SPR[name], c=document.createElement('canvas'), k=4; c.width=s[0].length*k; c.height=s.length*k; const x=c.getContext('2d');
  const sk=name.startsWith('ham')&&shade&&SKINS[shade]&&SKINS[shade].c;
  for(let j=0;j<s.length;j++)for(let i=0;i<s[j].length;i++){const ch=s[j][i]; if(ch==='.') continue; x.fillStyle=(sk==='rainbow'&&ch!=='0'?rainbowC(ch,i,0):(sk&&sk[ch]))||(typeof shade==='string'&&shade.startsWith('#')?shade:PAL.day[+ch]); x.beginPath(); x.arc(i*k+k/2,j*k+k/2,k*.42,0,6.283); x.fill();}
  return ICON[key]=`<img class="ico" src="${c.toDataURL()}" alt="">`; }

  }
  if(name==='settings'){
    const S=SAVE.settings, T=(k,l,d)=>`<label class="set"><div><b>${l}</b><span>${d}</span></div><input type="checkbox" data-set="${k}" ${S[k]?'checked':''}><i class="sw"></i></label>`;
    h=`<div class="body"><div class="top"><button class="btn back" data-nav="back">←</button><h2><em>SETTINGS</em></h2></div>
     ${T('music','Music','Chiptune that speeds up with the real wheel')}
     ${T('sfx','Sound effects','Jumps, seeds, rockets, explosions')}
     <label class="set"><div><b>Volume</b><span id="volv">${Math.round(S.vol*100)}%</span></div><input type="range" min="0" max="1" step=".05" value="${S.vol}" id="vol"></label>
     ${T('vib','Vibration','Buzz on jumps and hits (phones)')}
     ${T('shake','Screen shake','Shake on explosions')}
     <div class="sec">Data</div>
     <button class="btn" id="resetp" style="width:100%">Reset progress</button>
     <div class="meta">Progress is saved on this device. Signed runs stay tied to your wallet.</div></div>`;
  }
  if(name==='pause'){
    h=`<div class="body"><h2><em>PAUSED</em></h2><div class="big">${Math.floor(score)}</div>
     <button class="btn primary" id="resume">▶ Resume</button>
     <div class="row"><button class="btn" data-nav="settings">Settings</button><button class="btn" id="quit">Quit run</button></div></div>`;
  }
  if(name==='over') h=overHTML;
  m.innerHTML=h; cur=name; if(name==='main'||name==='over'||name==='how'||name==='rewards'||name==='settings') prevStack(name);
  bindMenu(); $('overlay').style.display='flex'; $('overlay').scrollTop=0;
}
function navHTML(){ return `<div class="nav"><button class="btn" data-nav="how">How to play</button><button class="btn" data-nav="rewards">Rewards${!dailyClaimed()?' <i class="dot"></i>':''}</button><button class="btn" data-nav="settings">Settings</button></div>`; }
let cur='main', home='main', overHTML='';
function prevStack(n){ if(n==='main'||n==='over') home=n; }
function bindMenu(){
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{SFX.click(); prediction=b.dataset.p; document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('sel',x===b));});
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{SFX.click(); const t=b.dataset.nav; if(t==='back') screen(state==='pause'?'pause':home); else screen(t);});
  const s=$('start'); if(s) s.onclick=start;
  const rs=$('resume'); if(rs) rs.onclick=resume;
  const q=$('quit'); if(q) q.onclick=()=>{ state='menu'; $('turbo').style.display='none'; $('stage').classList.remove('glow'); reset(); screen('main'); };
  const cl=$('claim'); if(cl) cl.onclick=()=>{ if(dailyClaimed()) return; SAVE.daily.streak=SAVE.daily.last===yesterday()?SAVE.daily.streak+1:1; SAVE.daily.last=today(); const a=dailyAmt(SAVE.daily.streak); SAVE.bank+=a; persist(); SFX.coin(); toast(`+${a} seeds · day ${SAVE.daily.streak}`); screen('rewards'); };
  document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>{ SAVE.map=b.dataset.map; persist(); SFX.click(); screen(cur); });
  document.querySelectorAll('[data-buymap]').forEach(b=>b.onclick=()=>{ const id=b.dataset.buymap, p=MAPS[id].p; if(SAVE.bank<p) return; SAVE.bank-=p; SAVE.maps.push(id); SAVE.map=id; persist(); SFX.gold(); toast(`${MAPS[id].n} unlocked`); screen('rewards'); });
  document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{ SAVE.skin=b.dataset.equip; persist(); SFX.click(); screen('rewards'); });
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{ const id=b.dataset.buy, p=SKINS[id].p; if(SAVE.bank<p) return; SAVE.bank-=p; SAVE.skins.push(id); SAVE.skin=id; persist(); SFX.gold(); toast(`${SKINS[id].n} skin unlocked`); screen('rewards'); });
  document.querySelectorAll('[data-set]').forEach(i=>i.onchange=()=>{ SAVE.settings[i.dataset.set]=i.checked; persist(); auInit(); applyAudio(); SFX.click(); if(i.dataset.set==='vib'&&i.checked) vib(30); });
  const v=$('vol'); if(v) v.oninput=()=>{ SAVE.settings.vol=+v.value; $('volv').textContent=Math.round(v.value*100)+'%'; persist(); auInit(); applyAudio(); }; if(v) v.onchange=()=>SFX.seed();
  const rp=$('resetp'); if(rp) rp.onclick=()=>{ if(!confirm('Reset seeds, skins, achievements and best score on this device?')) return; localStorage.removeItem(SAVE_KEY); localStorage.removeItem('wr_best'); location.reload(); };
  const sg=$('sign'); if(sg) sg.onclick=async()=>{ if(!lastRun) return; sg.disabled=true; sg.textContent='Signing…';
    const r=await signRun(lastRun); if(r){ const rec={...lastRun,addr:W3.addr,sig:r.sig}; saveRun(rec); $('sigout').textContent='✓ Signed by '+short(W3.addr)+' · '+r.sig.slice(0,26)+'…'; sg.textContent='Signed ✓'; renderRuns(); unlock('signed'); } else { sg.disabled=false; sg.textContent='Sign score'; } };
  const sh=$('share'); if(sh) sh.onclick=()=>{ const t=`I scored ${lastRun.score} in Wheel Runner, dodging rockets on Squeektoshi's real wheel on @squeekchain 🐹🚀 ${location.origin}`; if(navigator.share) navigator.share({text:t}).catch(()=>{}); else open('https://x.com/intent/tweet?text='+encodeURIComponent(t)); };
  if(cur==='main'||cur==='over') prediction=null;
  renderRuns(); artLoop();
}
function menu(){ screen('main'); }
function over(by){
  state='over'; $('stage').classList.remove('glow'); $('pause').style.display='none'; $('turbo').style.display='none';
  if(by==='rocket') vib([40,40,120]); else { SFX.hit(); vib(120); }
  let final=Math.floor(score), bonus='', ok=false;
  if(prediction){ok=(prediction==='run')===live.running; if(ok){final=Math.floor(final*1.5); bonus='Call correct · +50%';} else bonus='Wrong call · no bonus';} else bonus='No call made';
  const nb=final>bestScore; if(nb){bestScore=final; localStorage.setItem('wr_best',final); $('best').textContent=final; setTimeout(SFX.best,500);}
  const secs=((performance.now()-runStart)/1000).toFixed(1);
  const K={trap:'TRAP',box:'BOX',cat:'CAT',owl:'OWL',rocket:'ROCKET',cactus:'CACTUS',rock:'ASTEROID',stal:'STALAGMITE'};
  // progress
  const st=SAVE.stats; st.runs++; st.seeds+=seedsGot; st.rockets+=runRockets; st.gold+=runGold; if(ok) st.calls++; st.longest=Math.max(st.longest,playTime); st.smashed=(st.smashed||0)+runSmash;
  SAVE.bank+=seedsGot; persist();
  unlock('first'); if(final>=1000) unlock('s1k'); if(final>=5000) unlock('s5k'); if(st.seeds>=250) unlock('seeds'); if(st.rockets>=15) unlock('rocket');
  if(runGold) unlock('gold'); if(!live.running&&final>=1000) unlock('night'); if(st.calls>=5) unlock('prophet'); if(playTime>=90) unlock('marathon'); if(st.smashed>=10) unlock('turbo');
  lastRun={score:final,seeds:seedsGot,block:live.block,wheel:live.running?'running':'asleep',rpm:Math.round(live.rpm),t:Date.now(),secs};
  overHTML=`${ART}<div class="body">
   <h2>${nb?'NEW <em>BEST</em>':'HIT BY <em>'+K[by]+'</em>'}</h2>
   <div class="big">${final}</div>
   <div class="kv">
     <div><span>Time</span>${secs}s</div><div><span>Seeds banked</span>+${seedsGot}</div>
     <div><span>Rockets dodged</span>${runRockets}</div><div><span>Prediction</span>${bonus}</div>
     <div><span>Wheel at finish</span>${live.running?'Running · '+Math.round(live.rpm)+' RPM':'Asleep'}</div><div><span>Seed bank</span>${SAVE.bank}</div>
   </div>
   <div class="row"><button class="btn" id="sign">${W3.addr?'Sign score':'Connect & sign'}</button><button class="btn" id="share">Share on X</button></div>
   <div class="sig" id="sigout"></div>
   ${predHTML()}
   <button class="btn primary" id="start">↻ Run again</button>
   ${navHTML()}
   <div id="runs"></div>
  </div>`;
  setTimeout(()=>screen('over'),by==='rocket'?450:0);
}
// animated header art in cards (mini dot-matrix wheel)
let artRAF;
function artLoop(){
  cancelAnimationFrame(artRAF);
  const c=$('artc'); if(!c) return; const x=c.getContext('2d');
  const draw=t=>{
    if(!document.body.contains(c)) return;
    const w=c.clientWidth,h=c.clientHeight,d=Math.min(2,devicePixelRatio||1); if(c.width!==w*d){c.width=w*d;c.height=h*d;}
    x.setTransform(d,0,0,d,0,0); x.fillStyle='#0d0d0f'; x.fillRect(0,0,w,h);
    const P2=mixPal(nightT), cell=6, cols=Math.ceil(w/cell), rows=Math.ceil(h/cell);
    const cx=cols/2, cy=rows/2, R=rows*0.38, ang=(t/1000)*(Math.max(8,live.rpm)/60)*Math.PI;
    for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
      const dx=i-cx,dy=j-cy,dd=Math.sqrt(dx*dx+dy*dy); let s=0;
      if(Math.abs(dd-R)<.7) s=4; else if(dd<R){const a=Math.atan2(dy,dx)-ang; const m=((a%(Math.PI/4))+Math.PI/4)%(Math.PI/4); if(m<.12||dd<1.2) s=3;}
      const txt=Math.abs(i-cx)>R+3; if(txt&&((i*7+j*13+Math.floor(t/400))%23===0)) s=1;
      x.fillStyle=s?P2[s]:'#17140e'; if(nightT>.5&&!s) x.fillStyle='#0b1418';
      x.beginPath(); x.arc(i*cell+cell/2,j*cell+cell/2,cell*.38,0,6.283); x.fill();
    }
    artRAF=requestAnimationFrame(draw);
  };
  artRAF=requestAnimationFrame(draw);
}
$('pause').onclick=e=>{e.stopPropagation(); pause();};
$('turbo').addEventListener('pointerdown',e=>{e.preventDefault(); e.stopPropagation(); auInit(); fireTurbo();});

let lastT=0;
function loop(t){
  const dt=Math.min(.033,(t-(lastT||t))/1000); lastT=t;
  nightT+=((live.running?0:1)-nightT)*Math.min(1,dt*0.8);
  if(state==='play') step(dt);
  render(t);
  requestAnimationFrame(loop);
}
resize(); reset(); menu(); requestAnimationFrame(loop);
})();
</script>
